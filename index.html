<html>
<head>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="app.js"></script>
</head>

<body>
  <a-scene
    mindar-image1="imageTargetSrc: assets/hydrogen.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
   <a-scene
    mindar-image2="imageTargetSrc: assets/oxygen.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Hydrogen -->
    <a-entity mindar-image1-target="targetIndex: 0">
      <a-plane
        color="blue"
        width="1"
        height="0.5"
        position="0 0 0"
      >
      </a-plane>

      <a-text
        value="Hydrogen"
        color="white"
        align="center"
        position="0 0 0.01"
      ></a-text>
      
    </a-entity>

    <!-- Oxygen -->
    <a-entity mindar-image2-target="targetIndex: 1">
      <a-plane
        color="green"
        width="1"
        height="0.5"
        position="0 0 0"
      >
      </a-plane>

      <a-text
        value="Oxygen"
        color="white"
        align="center"
        position="0 0 0.01"
      ></a-text>
      
    </a-entity>

  </a-scene>
</body>
</html>
