<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR Chemistry MVP v2</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
    }

    #ui {
      position: fixed;
      bottom: 0;
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.7);
    }

    #status {
      font-size: 16px;
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #00aaff;
      border: none;
      color: white;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: assets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>

  <a-camera position="0 0 0" look-controls="false"></a-camera>

  <!-- HYDROGEN -->
  <a-entity mindar-image-target="targetIndex: 0" data-name="H" id="H">
    <a-plane color="blue" width="1" height="0.6"></a-plane>
    <a-text value="Hydrogen (H)" align="center" color="white" position="0 0 0.01"></a-text>
  </a-entity>

  <!-- OXYGEN -->
  <a-entity mindar-image-target="targetIndex: 1" data-name="O" id="O">
    <a-plane color="red" width="1" height="0.6"></a-plane>
    <a-text value="Oxygen (O)" align="center" color="white" position="0 0 0.01"></a-text>
  </a-entity>

</a-scene>

<div id="ui">
  <div id="status">No elements detected</div>
  <button onclick="manualCheck()">Combine Elements</button>
</div>

<script>
  // ✅ STABLE STATE SYSTEM (IMPORTANT FIX)
  const state = {
    H: false,
    O: false
  };

  // register tracker safely
  function attachTracker(id, key) {
    const el = document.getElementById(id);

    el.addEventListener("targetFound", () => {
      state[key] = true;
      updateUI();
      autoCheck();
    });

    el.addEventListener("targetLost", () => {
      state[key] = false;
      updateUI();
    });
  }

  attachTracker("H", "H");
  attachTracker("O", "O");

  function getActive() {
    return Object.keys(state).filter(k => state[k]);
  }

  function updateUI() {
    const active = getActive();

    document.getElementById("status").innerText =
      active.length === 0
        ? "No elements detected"
        : "Detected: " + active.join(", ");
  }

  // 🔥 AUTO REACTION CHECK (FIXED LOGIC)
  function autoCheck() {
    if (state.H && state.O) {
      showResult("💧 WATER (H₂O)");
    }
  }

  // manual button
  function manualCheck() {
    if (state.H && state.O) {
      showResult("💧 WATER (H₂O)");
    } else {
      alert("Need 2 elements");
    }
  }

  function showResult(text) {
    document.getElementById("status").innerText = text;
  }

</script>

</body>
</html>
