<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR Chemistry Scan-Lock MVP</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
    }

    #ui {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.75);
      padding: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      background: #00aaff;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: assets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>

  <a-camera position="0 0 0" look-controls="false"></a-camera>

  <!-- HYDROGEN -->
  <a-entity mindar-image-target="targetIndex: 0" data-name="H" id="H">
    <a-plane color="blue" width="1" height="0.6"></a-plane>
    <a-text value="Hydrogen" align="center" color="white"></a-text>
  </a-entity>

  <!-- OXYGEN -->
  <a-entity mindar-image-target="targetIndex: 1" data-name="O" id="O">
    <a-plane color="red" width="1" height="0.6"></a-plane>
    <a-text value="Oxygen" align="center" color="white"></a-text>
  </a-entity>

</a-scene>

<div id="ui">
  <div id="status">Scan first element</div>

  <button onclick="combine()">Combine</button>
  <button onclick="reset()">Reset</button>
</div>

<script>
  // 🔒 LOCKED SELECTION SYSTEM
  let selected = [];
  let lastScanned = null;

  function attach(id, key) {
    const el = document.getElementById(id);

    el.addEventListener("targetFound", () => {

      lastScanned = key;

      // add ONLY if not already selected
      if (!selected.includes(key)) {
        selected.push(key);
        updateUI();
      }

    });
  }

  attach("H", "H");
  attach("O", "O");

  function updateUI() {
    const status = document.getElementById("status");

    if (selected.length === 0) {
      status.innerText = "Scan first element";
    } else if (selected.length === 1) {
      status.innerText = "Selected: " + selected[0] + " (scan second)";
    } else {
      status.innerText = "Ready to combine: " + selected.join(" + ");
    }
  }

  function combine() {
    const key = selected.sort().join("+");

    const reactions = {
      "H+O": "💧 WATER (H₂O)"
    };

    if (reactions[key]) {
      document.getElementById("status").innerText =
        "Result: " + reactions[key];
    } else {
      alert("No reaction found");
    }
  }

  function reset() {
    selected = [];
    lastScanned = null;
    updateUI();
  }

</script>

</body>
</html>
