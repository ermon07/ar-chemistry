<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR Chemistry MVP + Bootstrap UI</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    #uiPanel {
      position: fixed;
      bottom: 0;
      width: 100%;
      padding: 15px;
      background: rgba(20,20,20,0.85);
      color: white;
      z-index: 10;
    }

    .tag {
      font-size: 14px;
    }
  </style>
</head>

<body>

<!-- AR SCENE -->
<a-scene
  mindar-image="imageTargetSrc: assets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>

  <a-camera position="0 0 0" look-controls="false"></a-camera>

  <!-- Hydrogen -->
  <a-entity mindar-image-target="targetIndex: 0" data-name="H" id="H">
    <a-plane color="#0d6efd" width="1" height="0.6"></a-plane>
    <a-text value="Hydrogen" align="center" color="white" position="0 0 0.01"></a-text>
  </a-entity>

  <!-- Oxygen -->
  <a-entity mindar-image-target="targetIndex: 1" data-name="O" id="O">
    <a-plane color="#dc3545" width="1" height="0.6"></a-plane>
    <a-text value="Oxygen" align="center" color="white" position="0 0 0.01"></a-text>
  </a-entity>

</a-scene>

<!-- BOOTSTRAP UI -->
<div id="uiPanel" class="container-fluid">

  <div class="row mb-2">
    <div class="col">
      <h5>AR Chemistry Lab</h5>
      <div id="status" class="tag text-warning">Scan first element</div>
    </div>
  </div>

  <div class="row g-2">

    <div class="col-6">
      <button class="btn btn-primary w-100" onclick="combine()">
        Combine
      </button>
    </div>

    <div class="col-6">
      <button class="btn btn-secondary w-100" onclick="reset()">
        Reset
      </button>
    </div>

  </div>

  <div class="mt-2">
    <div class="tag">
      Selected: <span id="selectedList">None</span>
    </div>
  </div>

</div>

<script>
  // 🔒 SCAN-LOCK SYSTEM
  let selected = [];

  function attach(id, key) {
    const el = document.getElementById(id);

    el.addEventListener("targetFound", () => {

      if (!selected.includes(key)) {
        selected.push(key);
        updateUI();
      }

    });
  }

  attach("H", "H");
  attach("O", "O");

  function updateUI() {
    document.getElementById("selectedList").innerText =
      selected.length ? selected.join(" + ") : "None";

    const status = document.getElementById("status");

    if (selected.length === 0) {
      status.innerText = "Scan first element";
      status.className = "tag text-warning";
    } else if (selected.length === 1) {
      status.innerText = "Scan second element";
      status.className = "tag text-info";
    } else {
      status.innerText = "Ready to combine";
      status.className = "tag text-success";
    }
  }

  function combine() {
    const key = selected.sort().join("+");

    const reactions = {
      "H+O": "💧 WATER (H₂O)"
    };

    if (reactions[key]) {
      document.getElementById("status").innerText =
        "Result: " + reactions[key];
    } else {
      alert("No reaction found");
    }
  }

  function reset() {
    selected = [];
    updateUI();
  }

</script>

</body>
</html>
